[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "jappractice"
version = "0.1.0"
description = "Japanese spelling practice application"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "openpyxl>=3.1.5,<4",
]

[project.scripts]
jappractice = "jappractice.app:main"

[tool.hatch.build.targets.wheel]
packages = ["src/jappractice"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.pytest.ini_options]
testpaths = ["tests"]
